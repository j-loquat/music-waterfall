[project]
name = "music-waterfall"
version = "0.1.0"
description = "Local Windows piano waterfall video creator for MIDI and reviewed sheet music"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Jackson" },
]
keywords = ["midi", "musicxml", "piano", "practice", "waterfall-video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3.3,<2",
    "music21>=9.7,<10",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "platformdirs>=4.3,<5",
    "pypdf>=5,<7",
    "pyside6>=6.8,<7",
]

[project.scripts]
music-waterfall = "music_waterfall.cli:main"
music-waterfall-gui = "music_waterfall.gui:main"

[project.urls]
Repository = "https://github.com/j-loquat/music-waterfall"
Issues = "https://github.com/j-loquat/music-waterfall/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/music_waterfall"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=output/test-temp"
testpaths = ["tests"]
markers = [
    "integration: exercises installed local media tools",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
